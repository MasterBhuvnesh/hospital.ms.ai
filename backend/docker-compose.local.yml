# ──────────────────────────────────────────────────────
# HMS — Docker Compose (Local Build)
# ──────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.local.yml up -d              Start all services
#   docker compose -f docker-compose.local.yml up -d <name>       Start a single service
#   docker compose -f docker-compose.local.yml down                Stop all services
#   docker compose -f docker-compose.local.yml logs -f             Follow logs
#   docker compose -f docker-compose.local.yml build               Build all images
#   docker compose -f docker-compose.local.yml build <name>        Build a single image
# ──────────────────────────────────────────────────────

services:
  # ── API Gateway ───────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: packages/services/api-gateway/Dockerfile
    container_name: hms-api-gateway
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
    networks:
      - hms-network
    restart: unless-stopped

  # ── Identity Service ──────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: packages/services/identity-service/Dockerfile
    container_name: hms-identity-service
    ports:
      - '5001:5001'
    environment:
      - NODE_ENV=production
      - PORT=5001
      - NOTIFICATION_SERVICE_URL=http://hms-notification-service:5015
    depends_on:
      - notification-service
    networks:
      - hms-network
    restart: unless-stopped

  # ── Doctor Service ────────────────────────────────
