# ──────────────────────────────────────────────────────
# HMS — Docker Compose (Database & Infrastructure)
# ──────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.db.yml up -d              Start all infra
#   docker compose -f docker-compose.db.yml up -d postgres     Start only PostgreSQL
#   docker compose -f docker-compose.db.yml down                Stop all infra
#   docker compose -f docker-compose.db.yml logs -f             Follow logs
#
# Data persists across restarts via named volumes.
# To wipe data:  docker compose -f docker-compose.db.yml down -v
# ──────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ────────────────────────────────────
  # Primary database for 16 services (database-per-service)
  # Init script creates all databases on first run
  postgres:
    image: postgres:16-alpine
    container_name: hms-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms_secret}
      POSTGRES_DB: hms_identity
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    networks:
      - hms-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hms_admin}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──────────────────────────────────────────
  # Sessions, caching, real-time queue state, rate limiting
  # AOF persistence enabled for durability across restarts
  redis:
    image: redis:7-alpine
    container_name: hms-redis
    ports:
      - '6379:6379'
    command: >
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:-hms_redis_secret}
    volumes:
      - redis-data:/data
    networks:
      - hms-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-hms_redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch 8 ──────────────────────────────────
  # Full-text search for doctors, hospitals, medicines
  # Used by Search & Discovery Service (port 5004)
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: hms-elasticsearch
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=hms-search
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - hms-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (S3-compatible Object Storage) ─────────────
  # Medical documents, lab reports, call recordings
  # Console UI at http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: hms-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hms_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - hms-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO Bucket Init ────────────────────────────────
  # Creates default buckets on first run, then exits
  minio-init:
    image: minio/mc:latest
    container_name: hms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set hms http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing hms/hms-medical-docs;
        mc mb --ignore-existing hms/hms-lab-reports;
        mc mb --ignore-existing hms/hms-call-recordings;
        echo 'Buckets created successfully';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hms_minio_secret}
    networks:
      - hms-network

  # ── RabbitMQ 3.13 ────────────────────────────────────
  # Event-driven messaging between services
  # Management UI at http://localhost:15672
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hms-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hms_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hms_rabbit_secret}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hms-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

# ── Named Volumes (persist across restarts) ─────────────
volumes:
  postgres-data:
    name: hms-postgres-data
  redis-data:
    name: hms-redis-data
  elasticsearch-data:
    name: hms-elasticsearch-data
  minio-data:
    name: hms-minio-data
  rabbitmq-data:
    name: hms-rabbitmq-data

# ── Network ─────────────────────────────────────────────
networks:
  hms-network:
    name: hms-network
    driver: bridge
