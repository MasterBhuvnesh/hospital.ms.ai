# ──────────────────────────────────────────────────────
# HMS — Docker Compose
# ──────────────────────────────────────────────────────
# Usage:
#   docker compose up -d          Start all services
#   docker compose up -d <name>   Start a single service
#   docker compose down           Stop all services
#   docker compose logs -f        Follow logs
# ──────────────────────────────────────────────────────

services:
  # ── API Gateway ───────────────────────────────────
  api-gateway:
    image: verma2904/hms-api-gateway:latest
    container_name: hms-api-gateway
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
    networks:
      - hms-network
    restart: unless-stopped

  # ── Identity Service ──────────────────────────────
  identity-service:
    image: verma2904/hms-identity-service:latest
    container_name: hms-identity-service
    ports:
      - '5001:5001'
    environment:
      - NODE_ENV=production
      - PORT=5001
      - NOTIFICATION_SERVICE_URL=http://hms-notification-service:5015
    depends_on:
      - notification-service
    networks:
      - hms-network
    restart: unless-stopped

  # ── Doctor Service ────────────────────────────────
  doctor-service:
    image: verma2904/hms-doctor-service:latest
