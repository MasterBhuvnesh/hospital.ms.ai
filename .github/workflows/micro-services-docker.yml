# ──────────────────────────────────────────────────────
# HMS — Docker Image Build & Push (Triggered by version tags)
# ──────────────────────────────────────────────────────
# Trigger: Push a tag like "doctor-service-v1.2.0"
# Result:  Builds & pushes verma2904/hms-doctor-service:latest
#                          verma2904/hms-doctor-service:1.2.0
# ──────────────────────────────────────────────────────

name: Build & Push Service Docker Image

on:
  push:
    tags:
      - '*-v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract service name and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Tag format: <service-name>-v<version>
          # e.g. doctor-service-v1.2.0 → SERVICE=doctor-service, VERSION=1.2.0
          SERVICE="${TAG%-v*}"
          VERSION="${TAG##*-v}"

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "SERVICE=$SERVICE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=hms-$SERVICE" >> $GITHUB_OUTPUT

          echo "Service: $SERVICE"
          echo "Version: $VERSION"
          echo "Image:   ${{ secrets.DOCKER_USERNAME }}/hms-$SERVICE"

      - name: Validate service directory exists
        run: |
          SERVICE="${{ steps.meta.outputs.SERVICE }}"
          if [ ! -d "backend/packages/services/$SERVICE" ]; then
            echo "Error: Service directory 'backend/packages/services/$SERVICE' not found!"
            echo "Available services:"
            ls backend/packages/services/
            exit 1
          fi
          echo "Service directory found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/packages/services/${{ steps.meta.outputs.SERVICE }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ steps.meta.outputs.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}

      - name: Print summary
        run: |
          echo ""
          echo "Docker image built and pushed successfully!"
          echo ""
          echo "  Service: ${{ steps.meta.outputs.SERVICE }}"
          echo "  Version: ${{ steps.meta.outputs.VERSION }}"
          echo ""
          echo "  Images:"
          echo "     - ${{ secrets.DOCKER_USERNAME }}/${{ steps.meta.outputs.IMAGE_NAME }}:latest"
          echo "     - ${{ secrets.DOCKER_USERNAME }}/${{ steps.meta.outputs.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}"
          echo ""
