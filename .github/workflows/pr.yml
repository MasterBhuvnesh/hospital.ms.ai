name: pr
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose. action-setup reads `packageManager` from the
      # root package.json, so the version lives in exactly one place and a bump
      # cannot leave CI on the old one.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Separate step because tsconfig.base.json excludes tests from the build so
      # tsc does not emit them into dist. Without this they would never be
      # typechecked, and a test can assert against a type that no longer exists
      # and still look green.
      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all-in-one image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: hms-platform:pr-${{ github.sha }}
          cache-from: type=gha,scope=platform-pr
          cache-to: type=gha,mode=max,scope=platform-pr
