# ──────────────────────────────────────────────────────
# HMS — Rebuild All Services (Triggered by common package updates)
# ──────────────────────────────────────────────────────
# Trigger: Push a tag like "common-logging-v1.1.0"
# Result:  Rebuilds and pushes ALL 21 service images
#          since they all depend on common packages
# ──────────────────────────────────────────────────────

name: Rebuild All Services (Common Package Update)

on:
  push:
    tags:
      - 'common-*-v*'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.meta.outputs.PACKAGE }}
      version: ${{ steps.meta.outputs.VERSION }}
    steps:
      - name: Extract package name and version
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Tag format: common-<package>-v<version>
          # e.g. common-logging-v1.1.0 -> PACKAGE=logging, VERSION=1.1.0
          PACKAGE="${TAG#common-}"
          PACKAGE="${PACKAGE%-v*}"
          VERSION="${TAG##*-v}"

          echo "PACKAGE=$PACKAGE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          echo "Common package updated: $PACKAGE v$VERSION"
          echo "All services will be rebuilt."

  build-and-push:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - analytics-service
          - api-gateway
          - appointment-service
          - billing-service
          - calling-service
          - consultation-service
          - doctor-service
          - hospital-service
          - identity-service
          - inventory-service
          - lab-result-service
          - lab-test-service
          - notification-service
          - patient-records-service
          - patient-sheet-service
          - pharmacy-service
          - prescription-service
          - queue-service
          - realtime-service
          - search-service
          - whatsapp-service
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get service version
        id: svc_version
        run: |
          VERSION=$(grep -oP '"version": "\K[^"]+' backend/packages/services/${{ matrix.service }}/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/packages/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hms-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/hms-${{ matrix.service }}:${{ steps.svc_version.outputs.VERSION }}

      - name: Print result
        run: |
          echo "Built ${{ matrix.service }} (v${{ steps.svc_version.outputs.VERSION }})"
          echo "  Triggered by: common-${{ needs.detect.outputs.package }} v${{ needs.detect.outputs.version }}"
