name: main
on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---- eight service images -------------------------------------------------
  build-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, directory, scheduling, clinical, commerce, comms, ai]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- ECR: enable when production pulls move to AWS ──────────────────
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ap-south-1
      #
      # - name: Log in to Amazon ECR
      #   id: ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      # ──────────────────────────────────────────────────────────────────────

      - name: Build and push per-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/hms-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---- the all-in-one image, same commit, same tag --------------------------
  build-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- ECR: enable when production pulls move to AWS ──────────────────
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ap-south-1
      #
      # - name: Log in to Amazon ECR
      #   id: ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      # ──────────────────────────────────────────────────────────────────────

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/hms-platform:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - name: Smoke test all-in-one image
        run: ./scripts/ci/smoke-all-in-one.sh ${{ github.sha }}

  # ---- the custom broker image ----------------------------------------------
  build-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- ECR: enable when production pulls move to AWS ──────────────────
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }
      #     aws-region: ap-south-1
      #
      # - name: Log in to Amazon ECR
      #   id: ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      # ──────────────────────────────────────────────────────────────────────

      - name: Build and push broker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rabbitmq/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/hms-rabbitmq:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=broker
          cache-to: type=gha,mode=max,scope=broker

