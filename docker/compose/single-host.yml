# The whole backend in one container. One hospital, one Linux box, no Kubernetes.
#
# Deliberately does NOT include deps.yml, so the same file serves both data planes:
#
#   local dependencies      docker compose -f deps.yml -f single-host.yml up -d
#   managed providers       docker compose -f single-host.yml up -d
#                           (with DATABASE_URL etc. pointing at them)
#
# Only the gateway publishes a port. Everything else is reachable on the Compose
# network and nowhere else, which is the same posture as ClusterIP.
name: hms-single

x-platform: &platform
  image: hms-platform:${TAG:-local}
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  env_file:
    - path: ../../envs/.env.container
      required: false
  restart: unless-stopped

# `depends_on` is NOT in the anchor above, because `migrate` uses that anchor too
# and would then depend on itself.
x-after-migrate: &after-migrate
  migrate: { condition: service_completed_successfully }

services:
  # Runs first, alone, so nothing races the schema.
  #
  # Deliberately depends on NO other Compose service. This file has no database
  # of its own — it serves both data planes — so depending on a `postgres`
  # service would make the managed-provider form fail with "undefined service".
  # docker/migrate.sh retries the migration instead, which covers both a local
  # Postgres that is still starting and a managed endpoint that is briefly
  # unreachable.
  migrate:
    <<: *platform
    restart: 'no'
    entrypoint: ['sh', '/app/docker/migrate.sh']

  # Seven services, one process, one event loop.
  platform:
    <<: *platform
    environment:
      SERVICES: gateway,identity,directory,scheduling,clinical,commerce,comms
      HEALTH_PORT: 4000
    ports: ['${BIND_ADDR:-127.0.0.1}:4000:4000']
    depends_on: *after-migrate

  # `ai` runs apart on purpose, and this is the one thing in this file that is not
  # arbitrary. Node is single-threaded: an embedding computation on the same event
  # loop as the queue stalls every live token update in the building. Splitting it
  # costs one more container from the same image and keeps the queue responsive,
  # which is the entire product.
  #
  # Drop this service and add `ai` to SERVICES above if the deployment has no AI
  # features enabled. Nothing else changes.
  ai:
    <<: *platform
    environment:
      SERVICES: ai
      HEALTH_PORT: 5007
    depends_on: *after-migrate
