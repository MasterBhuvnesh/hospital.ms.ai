# Local scrape configuration.
#
# In development the eight services run on the HOST via `pnpm dev`, not in
# containers, so targets are reached through host.docker.internal. In Compose
# and Kubernetes they are reached by service name, and Kubernetes uses
# ServiceMonitor discovery instead of this file entirely.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    profile: local

scrape_configs:
  - job_name: hms-services
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels: { service: gateway }
      - targets: ['host.docker.internal:5001']
        labels: { service: identity }
      - targets: ['host.docker.internal:5002']
        labels: { service: directory }
      - targets: ['host.docker.internal:5003']
        labels: { service: scheduling }
      - targets: ['host.docker.internal:5004']
        labels: { service: clinical }
      - targets: ['host.docker.internal:5005']
        labels: { service: commerce }
      - targets: ['host.docker.internal:5006']
        labels: { service: comms }
      - targets: ['host.docker.internal:5007']
        labels: { service: ai }

  # A service that is not running yet simply shows as down. That is the
  # correct local behaviour, not an error to configure away.
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
