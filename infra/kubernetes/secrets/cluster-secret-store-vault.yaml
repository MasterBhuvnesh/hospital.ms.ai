# =============================================================================
#  Vault, for the portable profile.
#
#  A hospital running their own cluster has no AWS account, so Secrets Manager
#  is not an option. This store and the AWS one are interchangeable from the
#  application's point of view: the ExternalSecret in the chart names a store
#  by string, and the pod sees process environment either way.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hms-store
spec:
  provider:
    vault:
      server: https://vault.internal:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: hms
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# The fallback below that: the in-cluster Kubernetes backend, for a customer
# with no Vault either. Sealed Secrets covers the same case without an
# operator that needs a backing store at all.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hms-kubernetes-store
spec:
  provider:
    kubernetes:
      remoteNamespace: hms-secrets
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
