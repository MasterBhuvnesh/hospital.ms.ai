# =============================================================================
#  The environment secret, per namespace.
#
#  Keys, not values. Every entry below names a remote key in the store. The
#  value never passes through git, a values file, a container image, or a
#  terminal. The full inventory of what each key is and who issues it lives in
#  envs/CATALOGUE.md.
#
#  The chart can render this itself when externalSecret.enabled is true. This
#  standalone copy exists for the case where the secret must be in place before
#  the first `helm install`, which is most first installs.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hms-env
  namespace: hms-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hms-aws-store
    kind: ClusterSecretStore
  target:
    name: hms-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Assembled from parts so a password rotation changes one remote key
        # rather than every connection string that embeds it.
        DATABASE_URL: "postgresql://{{ .dbUser }}:{{ .dbPassword }}@{{ .dbHost }}:5432/hms?sslmode=verify-full"
        REDIS_URL: "rediss://:{{ .redisPassword }}@{{ .redisHost }}:6379"
        RABBITMQ_URL: "amqp://{{ .brokerUser }}:{{ .brokerPassword }}@hms-rabbitmq:5672"
  data:
    - secretKey: dbUser
      remoteRef: { key: hms/production/database, property: username }
    - secretKey: dbPassword
      remoteRef: { key: hms/production/database, property: password }
    - secretKey: dbHost
      remoteRef: { key: hms/production/database, property: host }
    - secretKey: redisPassword
      remoteRef: { key: hms/production/redis, property: password }
    - secretKey: redisHost
      remoteRef: { key: hms/production/redis, property: host }
    - secretKey: brokerUser
      remoteRef: { key: hms/production/rabbitmq, property: username }
    - secretKey: brokerPassword
      remoteRef: { key: hms/production/rabbitmq, property: password }
  dataFrom:
    # Everything else in one extract: JWT keys, S3 credentials, and the
    # provider tokens for SMS, voice, WhatsApp, push, payments and the LLM
    # endpoint. Adding a provider is a new remote key, not a manifest change.
    - extract:
        key: hms/production/env
