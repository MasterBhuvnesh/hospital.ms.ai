# =============================================================================
#  Sealed Secrets, for a customer with no secret store at all.
#
#  The encryptedData below is asymmetrically encrypted to the controller's
#  public key in the target cluster. It is safe in git by construction: only
#  the controller in that one cluster can decrypt it, and a copy of this file
#  is useless anywhere else.
#
#  Produced by, never written by hand:
#
#    kubectl create secret generic hms-env -n hms-production \
#      --from-env-file=envs/.env.production --dry-run=client -o yaml \
#    | kubeseal --format yaml --controller-namespace sealed-secrets \
#    > infra/kubernetes/secrets/sealed-hms-env.yaml
#
#  The values below are placeholders, not a real sealed payload.
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hms-env
  namespace: hms-production
spec:
  encryptedData:
    DATABASE_URL: AgBv1PLACEHOLDER0000000000000000000000000000000000000000000000
    REDIS_URL: AgBv1PLACEHOLDER0000000000000000000000000000000000000000000000
    RABBITMQ_URL: AgBv1PLACEHOLDER0000000000000000000000000000000000000000000000
    JWT_PRIVATE_KEY: AgBv1PLACEHOLDER0000000000000000000000000000000000000000000000
    JWT_PUBLIC_KEY: AgBv1PLACEHOLDER0000000000000000000000000000000000000000000000
  template:
    metadata:
      name: hms-env
      namespace: hms-production
    type: Opaque
