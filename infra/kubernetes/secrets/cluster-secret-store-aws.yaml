# =============================================================================
#  AWS Secrets Manager, reached through External Secrets and IRSA.
#
#  This is a REFERENCE to a store. There is no secret in this file and there
#  never will be. Nothing here is sensitive if it leaks.
#
#  Authentication is the service account's IRSA role, so no AWS key exists in
#  the cluster at all.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hms-aws-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
