{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- $root := . -}}
{{- range .Values.services }}
{{- $svc := . -}}
{{- $ctx := dict "root" $root "svc" $svc -}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hms.serviceName" $ctx }}
  labels:
    {{- include "hms.selectorLabels" $ctx | nindent 4 }}
    {{- include "hms.commonLabels" $root | nindent 4 }}
    {{- with $root.Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "hms.selectorLabels" $ctx | nindent 6 }}
  endpoints:
    - port: http
      path: {{ $root.Values.monitoring.serviceMonitor.path }}
      interval: {{ $root.Values.monitoring.serviceMonitor.interval }}
      scheme: http
      metricRelabelings:
        # Route labels are per-endpoint, not per-patient. Drop anything that
        # could carry an id into a metric series, because a metric label is a
        # log line that never expires.
        - sourceLabels: [__name__]
          regex: "hms_.*_patient_id.*"
          action: drop
{{- end }}
{{- end }}
