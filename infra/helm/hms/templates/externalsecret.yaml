{{- if .Values.externalSecret.enabled }}
# =============================================================================
#  A REFERENCE to a secret store. Never a secret.
#
#  Nothing in this file is sensitive if it leaks. The backend is a values
#  choice: kubernetes, vault, aws, gcp or azure. The application sees process
#  environment either way and never learns which store it came from.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "hms.fullname" . }}-env
  labels:
    {{- include "hms.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.envSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          # reloader restarts the pods holding this secret when it rotates.
          # Without it, a rotated database credential applies to new pods only.
          reloader.stakater.com/match: "true"
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKeyPrefix }}/env
{{- end }}
