{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hms.serviceAccountName" . }}
  labels:
    {{- include "hms.commonLabels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # Empty on the portable profile. values-aws.yaml fills in the IRSA role
    # here, which is the only reason this block is not hardcoded in the base.
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
