apiVersion: v2
name: hms
description: Atelier Health. One chart rendering all eight services from a values list.
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.28.0-0"
home: https://github.com/MasterBhuvnesh/hospital.ms.ai
sources:
  - https://github.com/MasterBhuvnesh/hospital.ms.ai
maintainers:
  - name: Bhuvnesh Verma
annotations:
  # The chart carries no dependencies on purpose. Postgres, Redis, RabbitMQ and
  # MinIO are installed by infra/terraform/modules/kubernetes so that the same
  # chart deploys against RDS and ElastiCache without a values-level fork.
  atelier.health/profile-default: portable
